<!DOCTYPE html>
<html lang="ru" data-theme="day" data-font="medium">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Вокзал виртуальных путешествий — бесплатные путешествия по миру для тех, кому дороги мечты">
  <title>Вокзал виртуальных путешествий</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚂</text></svg>">

  <script>
    (function () {
      try {
        var t = localStorage.getItem('vokzal_theme') || 'day';
        var f = localStorage.getItem('vokzal_font') || 'medium';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-font', f);
      } catch (e) { }
    })();
  </script>

  <style>
    /* =========================================================
       СБРОС И БАЗОВЫЕ НАСТРОЙКИ
       ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html[data-font="small"]  { font-size: 16px; }
    html[data-font="medium"] { font-size: 20px; }
    html[data-font="large"]  { font-size: 24px; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    :root,
    html[data-theme="day"] {
      --bg-main:            #faf4e1;
      --bg-header:          linear-gradient(135deg, #fdf8e9 0%, #f5e6c8 100%);
      --bg-card:            #ffffff;
      --bg-card-hover:      #fffbf0;
      --bg-btn-secondary:   #f0e8d0;
      --bg-btn-secondary-h: #e6dbb8;

      --text-main:          #1a2a4a;
      --text-muted:         #4a5a7a;
      --text-inverse:       #ffffff;

      --accent:             #d4a017;
      --accent-dark:        #b8860b;
      --accent-light:       #f0c040;
      --on-accent:          #1a2a4a;

      --border:             #e8ddc0;
      --border-strong:      #d4c090;

      --shadow-sm:          0 2px 8px rgba(26, 42, 74, 0.08);
      --shadow-md:          0 8px 24px rgba(26, 42, 74, 0.12);
      --shadow-lg:          0 16px 48px rgba(26, 42, 74, 0.18);
      --glow:               0 0 20px rgba(212, 160, 23, 0.35);
    }

    html[data-theme="night"] {
      --bg-main:            #0f1628;
      --bg-header:          linear-gradient(135deg, #0a1128 0%, #1a2440 100%);
      --bg-card:            #1a2440;
      --bg-card-hover:      #243058;
      --bg-btn-secondary:   #243058;
      --bg-btn-secondary-h: #2e3c6c;

      --text-main:          #e8e4d8;
      --text-muted:         #a8b0c8;
      --text-inverse:       #0f1628;

      --accent:             #f0b429;
      --accent-dark:        #ffc947;
      --accent-light:       #ffd966;
      --on-accent:          #0f1628;

      --border:             #2a3a5a;
      --border-strong:      #3a4a6a;

      --shadow-sm:          0 2px 8px rgba(0, 0, 0, 0.35);
      --shadow-md:          0 8px 24px rgba(0, 0, 0, 0.45);
      --shadow-lg:          0 16px 48px rgba(0, 0, 0, 0.55);
      --glow:               0 0 24px rgba(240, 180, 41, 0.55);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.35s ease, color 0.35s ease;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      background-image:
        radial-gradient(1.5px 1.5px at 15% 20%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px   1px   at 35% 60%, rgba(255,255,255,0.55), transparent),
        radial-gradient(2px   2px   at 60% 15%, rgba(255,220,150,0.65), transparent),
        radial-gradient(1px   1px   at 75% 40%, rgba(255,255,255,0.60), transparent),
        radial-gradient(1.5px 1.5px at 85% 70%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px   1px   at 25% 85%, rgba(255,255,255,0.45), transparent),
        radial-gradient(1.5px 1.5px at 50% 45%, rgba(255,230,180,0.55), transparent),
        radial-gradient(1px   1px   at 90% 25%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1px   1px   at 8%  50%, rgba(255,255,255,0.50), transparent),
        radial-gradient(1.5px 1.5px at 68% 88%, rgba(255,255,255,0.45), transparent);
    }
    html[data-theme="night"] body::before { opacity: 1; }

    body > * { position: relative; z-index: 1; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    :focus-visible {
      outline: 3px solid var(--text-main);
      outline-offset: 3px;
      border-radius: 4px;
    }

    .app-header {
      background: var(--bg-header);
      padding: 2rem 1.5rem 1.75rem;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .app-header::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.7;
      pointer-events: none;
    }

    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.15rem;
      margin-bottom: 1rem;
      padding: 0.6rem 0.85rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      font-size: 0.92rem;
      box-shadow: var(--shadow-sm);
      transition: background 0.35s ease, border-color 0.35s ease;
    }

    .crumb {
      display: inline-flex;
      align-items: center;
      padding: 0.3rem 0.55rem;
      border-radius: 0.5rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-family: inherit;
      font-size: inherit;
      line-height: 1.3;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      overflow-wrap: break-word;
      text-align: left;
    }
    .crumb:hover {
      background: var(--bg-btn-secondary);
      color: var(--accent-dark);
    }

    .crumb-current {
      color: var(--text-main);
      font-weight: 700;
      cursor: default;
    }

    .crumb-sep {
      color: var(--text-muted);
      opacity: 0.55;
      font-weight: 400;
      padding: 0 0.1rem;
      user-select: none;
      font-size: 1.05em;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      justify-content: space-between;
      align-items: flex-start;
    }

    .brand {
      flex: 1 1 320px;
      min-width: 0;
    }

    .brand h1 {
      font-size: 1.65rem;
      line-height: 1.2;
      color: var(--text-main);
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      font-size: 1.8rem;
      display: inline-block;
      margin-right: 0.25rem;
      vertical-align: middle;
      filter: drop-shadow(0 0 6px var(--accent));
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 52ch;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      flex-shrink: 0;
      min-width: 0;
      max-width: 100%;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .setting-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.25rem;
    }

    .btn-group button {
      padding: 0.5rem 0.7rem;
      font-size: 0.82rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-main);
      border-radius: 0.55rem;
      cursor: pointer;
      font-family: inherit;
      min-height: 2.5rem;
      line-height: 1;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    .btn-group button:hover {
      background: var(--bg-btn-secondary-h);
    }

    .btn-group button.active,
    .btn-group button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: var(--shadow-sm);
    }

    #app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    .screen {
      animation: screenFadeIn 0.4s ease-out;
    }
    @keyframes screenFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .hero-title {
      font-size: 1.75rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      line-height: 1.25;
    }
    .hero-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 54ch;
      margin: 0 auto;
    }

    .section-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .section-card {
      position: relative;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem 1.5rem 1.75rem;
      cursor: pointer;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      min-height: 17rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, box-shadow 0.25s ease,
                  border-color 0.25s ease, background 0.25s ease;
      color: var(--text-main);
      font-family: inherit;
    }

    .section-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md), var(--glow);
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    .section-card-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-top: 0.5rem;
    }

    .section-card h2 {
      font-size: 1.35rem;
      line-height: 1.3;
      color: var(--text-main);
    }

    .section-card p {
      font-size: 0.98rem;
      color: var(--text-muted);
      flex: 1;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 0.85rem;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      min-height: 3rem;
      margin-bottom: 1.75rem;
      transition: transform 0.2s ease, border-color 0.2s ease,
                  color 0.2s ease, box-shadow 0.2s ease;
    }
    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateX(-4px);
      box-shadow: var(--shadow-sm);
    }

    .screen-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .screen-header-icon {
      font-size: 3.5rem;
      line-height: 1;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 0 8px var(--accent));
    }
    .screen-header h2 {
      font-size: 1.75rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      line-height: 1.25;
    }
    .screen-header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 62ch;
      margin: 0 auto;
    }

    .subsection-title {
      font-size: 1.2rem;
      color: var(--text-main);
      margin-bottom: 1.25rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px solid var(--border);
      font-weight: 700;
    }

    .country-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .country-card {
      position: relative;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 1.1rem;
      padding: 1.35rem 3.4rem 1.35rem 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 1rem;
      min-height: 7rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, border-color 0.25s ease,
                  box-shadow 0.25s ease, background 0.25s ease;
      color: var(--text-main);
      font-family: inherit;
    }
    .country-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md), var(--glow);
      background: var(--bg-card-hover);
    }

    .country-flag {
      font-size: 2.4rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .country-info {
      min-width: 0;
      flex: 1;
    }
    .country-info h3 {
      font-size: 1.15rem;
      color: var(--text-main);
      margin-bottom: 0.3rem;
      overflow-wrap: break-word;
    }
    .country-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
      overflow-wrap: break-word;
    }

    .excursion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .excursion-card {
      position: relative;
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.25s ease, border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }
    .excursion-card:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md), var(--glow);
    }

    .excursion-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .excursion-header h3 {
      font-size: 1.25rem;
      line-height: 1.3;
      color: var(--text-main);
      flex: 1;
      min-width: 0;
      overflow-wrap: break-word;
    }

    .excursion-author {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      overflow-wrap: break-word;
    }

    .excursion-description {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.55;
      flex: 1;
      overflow-wrap: break-word;
    }

    .start-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 1.25rem;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 0.85rem;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      min-height: 3.25rem;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: background 0.2s ease, transform 0.15s ease,
                  box-shadow 0.2s ease;
      letter-spacing: 0.01em;
    }
    .start-btn:hover {
      background: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md), var(--glow);
    }
    .start-btn:active {
      transform: translateY(0);
    }

    /* =========================================================
       МАРКЕР "NEW" — мягко пульсирующая золотая плашка
       (дизайн НЕ менялся)
       ========================================================= */
    .badge-new {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: var(--on-accent);
      font-size: 0.62rem;
      font-weight: 900;
      letter-spacing: 0.1em;
      padding: 0.28rem 0.65rem;
      border-radius: 999px;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
      animation: badgePulse 2.2s ease-in-out infinite;
    }
    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(240, 180, 41, 0.65); }
      50%      { box-shadow: 0 0 0 7px rgba(240, 180, 41, 0); }
    }

    .section-card .badge-new {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
    }
    .country-card .badge-new {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
    }

    .country-info h3 .badge-new {
      position: static;
      margin-left: 0.4rem;
      vertical-align: middle;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      color: var(--text-muted);
      font-size: 1.05rem;
      font-style: italic;
      background: var(--bg-card);
      border-radius: 1rem;
      border: 2px dashed var(--border);
      grid-column: 1 / -1;
    }

    .app-footer {
      text-align: center;
      padding: 2rem 1.5rem 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }
    .app-footer strong {
      color: var(--accent);
      font-weight: 700;
    }

    @media (max-width: 720px) {
      .app-header { padding: 1.5rem 1rem 1.25rem; }
      .header-content { gap: 1rem; }
      .brand h1 { font-size: 1.4rem; }

      .settings {
        gap: 0.75rem 1rem;
        width: 100%;
        min-width: 0;
      }
      .setting-group { min-width: 0; }
      .btn-group { max-width: 100%; }
      .btn-group button {
        padding: 0.45rem 0.6rem;
        font-size: 0.78rem;
        min-width: 0;
      }

      .breadcrumbs {
        font-size: 0.82rem;
        padding: 0.5rem 0.7rem;
        margin-bottom: 0.85rem;
        gap: 0.1rem;
      }
      .crumb { padding: 0.25rem 0.4rem; }

      #app { padding: 1.5rem 1rem 3rem; }
      .hero-title { font-size: 1.4rem; }
      .screen-header h2 { font-size: 1.4rem; }
      .section-cards { grid-template-columns: 1fr; }
      .section-card { min-height: 14rem; padding: 1.75rem 1.25rem 1.5rem; }
      .section-card-icon { font-size: 3rem; }
    }

    @media (max-width: 420px) {
      .settings {
        flex-direction: column;
        width: 100%;
      }
      .setting-group { width: 100%; min-width: 0; }
      .btn-group {
        width: 100%;
        max-width: 100%;
      }
      .btn-group button {
        flex: 1 1 0;
        min-width: 0;
        white-space: normal;
        word-break: break-word;
        padding: 0.4rem 0.25rem;
        font-size: 0.7rem;
        line-height: 1.2;
      }
      .excursion-grid { grid-template-columns: 1fr; }
      .country-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <h1><span class="brand-icon" aria-hidden="true">🚂</span>Вокзал виртуальных путешествий</h1>
        <p class="tagline">
          Добро пожаловать на перрон мечты! Здесь поезда отправляются в любую точку планеты
          в любое время суток. Без билетов, чемоданов и пересадок — только вы и мир за окном.
        </p>
      </div>

      <div class="settings" role="group" aria-label="Настройки доступности">
        <div class="setting-group">
          <span class="setting-label" id="label-font">Размер шрифта</span>
          <div class="btn-group" role="group" aria-labelledby="label-font">
            <button type="button" data-font="small"  aria-pressed="false">Мелкий</button>
            <button type="button" data-font="medium" aria-pressed="true">Средний</button>
            <button type="button" data-font="large"  aria-pressed="false">Крупный</button>
          </div>
        </div>

        <div class="setting-group">
          <span class="setting-label" id="label-theme">Тема</span>
          <div class="btn-group" role="group" aria-labelledby="label-theme">
            <button type="button" data-theme="day"   aria-pressed="true">☀️ День</button>
            <button type="button" data-theme="night" aria-pressed="false">🌙 Ночь</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="app" aria-live="polite"></main>

  <footer class="app-footer">
    <p>🚉 Счастливого пути! <strong>Вокзал виртуальных путешествий</strong> всегда открыт для вас</p>
  </footer>

  <script>
  /* ============================================================
     ВОКЗАЛ ВИРТУАЛЬНЫХ ПУТЕШЕСТВИЙ — логика SPA
     ============================================================
     ВАЖНОЕ ОБ ИЗМЕНЕНИИ ЛОГИКИ «NEW»:

     Источник правды для маркера NEW — ТОЛЬКО экскурсии.
     Флаги isNew у разделов и стран из data.json НЕ читаются,
     они вычисляются на лету:

       • экскурсия NEW  →  isNew === true  и  её id ещё не в «просмотренных»;
       • страна NEW     →  есть хотя бы одна NEW-экскурсия;
       • раздел NEW     →  есть хотя бы одна NEW-страна.

     Погасить маркер на всей «цепочке» (экскурсия → страна → раздел)
     может только клик по кнопке «Начать экскурсию». Переходы по
     разделам и странам NEW больше НЕ сбрасывают.
     ============================================================ */

  (function () {

    var STORAGE_VISITED = 'vokzal_visited';

    /* ============================================================
       БЛОК 1. УТИЛИТЫ
       ============================================================ */

    function esc(value) {
      if (value == null) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }


    /* ============================================================
       БЛОК 2. РАБОТА С localStorage И ЛОГИКА NEW
       ============================================================ */

    function loadVisited() {
      try {
        var raw = localStorage.getItem(STORAGE_VISITED);
        if (!raw) return new Set();
        var arr = JSON.parse(raw);
        if (!Array.isArray(arr)) return new Set();
        return new Set(arr.filter(function (x) { return typeof x === 'string'; }));
      } catch (e) {
        console.warn('[Вокзал] Не удалось прочитать localStorage:', e);
        return new Set();
      }
    }

    function saveVisited() {
      try {
        localStorage.setItem(STORAGE_VISITED, JSON.stringify(Array.from(state.visited)));
      } catch (e) {
        console.warn('[Вокзал] Не удалось записать localStorage:', e);
      }
    }

    /**
     * Помечает id как просмотренный. Теперь вызывается ТОЛЬКО
     * на кнопке «Начать экскурсию» (клик по карточке раздела
     * или страны NEW больше не сбрасывает).
     */
    function markVisited(id) {
      if (!id) return;
      state.visited.add(id);
      saveVisited();
    }

    /* -------- Три уровня вычисления NEW -------- */

    /** Экскурсия NEW, если в JSON isNew === true и id не просмотрен. */
    function isExcursionNew(exc) {
      return !!(exc && exc.isNew === true && !state.visited.has(exc.id));
    }

    /** Страна NEW, если хотя бы одна её экскурсия — NEW. */
    function isCountryNew(country) {
      if (!country || !Array.isArray(country.excursions)) return false;
      return country.excursions.some(isExcursionNew);
    }

    /** Раздел NEW, если хотя бы одна его страна — NEW. */
    function isSectionNew(section) {
      if (!section || !Array.isArray(section.countries)) return false;
      return section.countries.some(isCountryNew);
    }

    /**
     * Возвращает HTML маркера NEW (дизайн — тот же, что был)
     * либо пустую строку. Принимает уже готовый boolean.
     */
    function newBadge(showNew) {
      return showNew ? '<span class="badge-new">NEW</span>' : '';
    }

    async function loadData() {
      try {
        var response = await fetch('data.json', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('HTTP-статус: ' + response.status);
        }
        var data = await response.json();
        if (!data || !Array.isArray(data.sections)) {
          throw new Error('Неверная структура data.json (ожидалось поле sections-массив)');
        }
        console.log('[Вокзал] Данные успешно загружены из data.json');
        return data;
      } catch (error) {
        console.warn(
          '[Вокзал] data.json недоступен, включены встроенные демо-данные. Причина:',
          error.message || error
        );
        return FALLBACK_DATA;
      }
    }


    /* ============================================================
       БЛОК 4. РЕНДЕР ЭКРАНОВ
       ============================================================ */

    function buildBreadcrumbs(items) {
      var html = '<nav class="breadcrumbs" aria-label="Хлебные крошки">';
      for (var i = 0; i < items.length; i++) {
        if (i > 0) {
          html += '<span class="crumb-sep" aria-hidden="true">›</span>';
        }
        var item = items[i];
        if (!item.action) {
          html += '<span class="crumb crumb-current" aria-current="page">' +
                  esc(item.label) + '</span>';
        } else {
          html += '<button type="button" class="crumb" data-crumb="' +
                  esc(item.action) + '">' + esc(item.label) + '</button>';
        }
      }
      html += '</nav>';
      return html;
    }

    function wireBreadcrumbs(app) {
      var crumbs = app.querySelectorAll('.crumb[data-crumb]');
      Array.prototype.forEach.call(crumbs, function (btn) {
        btn.addEventListener('click', function () {
          var action = btn.getAttribute('data-crumb') || '';
          if (action === 'home') {
            goHome();
          } else if (action.indexOf('section:') === 0) {
            var secId = action.substring('section:'.length);
            state.screen = 'section';
            state.currentSectionId = secId;
            state.currentCountryId = null;
            renderSection(secId);
            try { window.scrollTo({ top: 0, behavior: 'smooth' }); }
            catch (e) { window.scrollTo(0, 0); }
          }
        });
      });
    }

    /**
     * ГЛАВНЫЙ ЭКРАН. NEW у раздела теперь вычисляется по экскурсиям.
     */
    function renderHome() {
      var app = document.getElementById('app');

      var cardsHtml = state.data.sections.map(function (section) {
        var badge = newBadge(isSectionNew(section));
        return (
          '<div class="section-card" role="button" tabindex="0"' +
          ' data-section-id="' + esc(section.id) + '"' +
          ' aria-label="Открыть раздел: ' + esc(section.title) + '">' +
            badge +
            '<div class="section-card-icon" aria-hidden="true">' + esc(section.icon || '✨') + '</div>' +
            '<h2>' + esc(section.title) + '</h2>' +
            '<p>' + esc(section.description || '') + '</p>' +
          '</div>'
        );
      }).join('');

      app.innerHTML =
        '<section class="screen">' +
          '<div class="hero">' +
            '<h2 class="hero-title">Куда отправимся сегодня?</h2>' +
            '<p class="hero-subtitle">Выберите один из трёх перронов — и в путь, без билетов и чемоданов.</p>' +
          '</div>' +
          '<div class="section-cards">' + cardsHtml + '</div>' +
        '</section>';

      var cards = app.querySelectorAll('.section-card');
      Array.prototype.forEach.call(cards, function (card) {
        function activate() {
          var id = card.getAttribute('data-section-id');
          // NEW у раздела снимается только после клика
          // по кнопке «Начать экскурсию» — здесь markVisited НЕ вызываем.
          state.currentSectionId = id;
          state.screen = 'section';
          renderSection(id);
        }
        card.addEventListener('click', activate);
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            activate();
          }
        });
      });
    }

    /**
     * ЭКРАН РАЗДЕЛА. NEW у страны тоже вычисляется.
     */
    function renderSection(sectionId) {
      var section = state.data.sections.filter(function (s) { return s.id === sectionId; })[0];

      if (!section) {
        goHome();
        return;
      }

      var app = document.getElementById('app');

      var countries = Array.isArray(section.countries) ? section.countries : [];
      var countriesHtml = countries.length
        ? countries.map(function (country) {
            var badge = newBadge(isCountryNew(country));
            return (
              '<div class="country-card" role="button" tabindex="0"' +
              ' data-country-id="' + esc(country.id) + '"' +
              ' aria-label="Открыть страну: ' + esc(country.title) + '">' +
                '<span class="country-flag" aria-hidden="true">' + esc(country.flag || '🌍') + '</span>' +
                '<div class="country-info">' +
                  '<h3>' + esc(country.title) + ' ' + badge + '</h3>' +
                  '<p>' + esc(country.description || '') + '</p>' +
                '</div>' +
              '</div>'
            );
          }).join('')
        : '<p class="empty-state">В этом разделе пока нет стран — но поезда уже в пути!</p>';

      var breadcrumbsHtml = buildBreadcrumbs([
        { label: '🏠 Главная', action: 'home' },

      app.innerHTML =

          '<div class="country-grid">' + countriesHtml + '</div>' +
        '</section>';

      wireBreadcrumbs(app);

      app.querySelector('[data-action="home"]').addEventListener('click', goHome);

      var cards = app.querySelectorAll('.country-card');
      Array.prototype.forEach.call(cards, function (card) {
        function activate() {
          var id = card.getAttribute('data-country-id');
          // NEW у страны снимается только после клика
          // по кнопке «Начать экскурсию» — здесь markVisited НЕ вызываем.
          state.currentCountryId = id;
          state.screen = 'country';
          renderCountry(sectionId, id);
        }
        card.addEventListener('click', activate);
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            activate();
          }
        });

    /**
     * ЭКРАН СТРАНЫ. NEW у экскурсии — как было. Клик по «Начать
     * экскурсию» гасит маркер на всей цепочке (экскурсия → страна → раздел)
     * при следующей навигации, потому что все три уровня вычисляются.
     */
    function renderCountry(sectionId, countryId) {
      var section = state.data.sections.filter(function (s) { return s.id === sectionId; })[0];
      var country = section && Array.isArray(section.countries)
        ? section.countries.filter(function (c) { return c.id === countryId; })[0]
        : null;

      if (!country) {
        renderSection(sectionId);
        return;
      }

      var app = document.getElementById('app');

      var excursions = Array.isArray(country.excursions) ? country.excursions : [];
      var excursionsHtml = excursions.length
        ? excursions.map(function (exc) {
            var badge = newBadge(isExcursionNew(exc));
            return (
              '<article class="excursion-card" data-excursion-id="' + esc(exc.id) + '">' +
                '<div class="excursion-header">' +
                  '<h3>' + esc(exc.title) + '</h3>' +
                  badge +
                '</div>' +
                '<div class="excursion-author">' +
                  '<span aria-hidden="true">✍️</span> ' + esc(exc.author || 'Неизвестный автор') +
                '</div>' +
                '<p class="excursion-description">' + esc(exc.description || '') + '</p>' +
                '<a class="start-btn" href="' + esc(exc.url || '#') + '"' +
                ' target="_blank" rel="noopener noreferrer"' +
                ' data-excursion-id="' + esc(exc.id) + '"' +
                ' aria-label="Начать экскурсию: ' + esc(exc.title) + ' (откроется в новой вкладке)">' +
                  '<span aria-hidden="true">▶</span> Начать экскурсию' +
                '</a>' +
              '</article>'
            );
          }).join('')
        : '<p class="empty-state">Экскурсии в эту страну ещё готовятся — заходите чуть позже!</p>';

      var breadcrumbsHtml = buildBreadcrumbs([
        { label: '🏠 Главная', action: 'home' },
        { label: (section.icon || '✨') + ' ' + section.title,
          action: 'section:' + section.id },
        { label: (country.flag || '🌍') + ' ' + country.title, action: null }
      ]);

      app.innerHTML =
        '<section class="screen">' +
          breadcrumbsHtml +
          '<button type="button" class="back-btn" data-action="section">← Назад к разделу</button>' +
          '<header class="screen-header">' +
            '<div class="screen-header-icon" aria-hidden="true">' + esc(country.flag || '🌍') + '</div>' +
            '<h2>' + esc(country.title) + '</h2>' +
            '<p>' + esc(country.description || '') + '</p>' +
          '</header>' +
          '<h3 class="subsection-title">Доступные экскурсии</h3>' +
          '<div class="excursion-grid">' + excursionsHtml + '</div>' +
        '</section>';

      wireBreadcrumbs(app);

      app.querySelector('[data-action="section"]').addEventListener('click', function () {
        renderSection(sectionId);
      });

      // ЕДИНСТВЕННОЕ место, где гасится NEW.
      // <a target="_blank"> открывает ссылку штатно, мы лишь фиксируем
      // просмотр — и при следующей навигации маркер исчезнет
      // у экскурсии, её страны и её раздела (все три уровня вычисляются).
      var startButtons = app.querySelectorAll('.start-btn');
      Array.prototype.forEach.call(startButtons, function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-excursion-id');
          markVisited(id);

          // Мгновенный визуальный отклик на текущем экране
          var card = btn.closest('.excursion-card');
          if (card) {
            var badge = card.querySelector('.excursion-header .badge-new');
            if (badge) badge.parentNode.removeChild(badge);
          }
        });
      });
    }

      renderHome();

        window.scrollTo(0, 0);

    /* ============================================================

    function initSettings() {
      var root = document.documentElement;
      var currentTheme = root.getAttribute('data-theme') || 'day';
      var currentFont  = root.getAttribute('data-font')  || 'medium';

      var themeButtons = document.querySelectorAll('button[data-theme]');
      Array.prototype.forEach.call(themeButtons, function (btn) {
        var isActive = btn.getAttribute('data-theme') === currentTheme;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));

        btn.addEventListener('click', function () {
          var theme = btn.getAttribute('data-theme');
          root.setAttribute('data-theme', theme);
          try { localStorage.setItem(STORAGE_THEME, theme); } catch (e) {}

          Array.prototype.forEach.call(themeButtons, function (b) {
            var active = b === btn;
            b.classList.toggle('active', active);
            b.setAttribute('aria-pressed', String(active));
          });
        });
      });

      var fontButtons = document.querySelectorAll('button[data-font]');
      Array.prototype.forEach.call(fontButtons, function (btn) {
        var isActive = btn.getAttribute('data-font') === currentFont;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));

        btn.addEventListener('click', function () {
          var font = btn.getAttribute('data-font');
          root.setAttribute('data-font', font);
          try { localStorage.setItem(STORAGE_FONT, font); } catch (e) {}

          Array.prototype.forEach.call(fontButtons, function (b) {
            var active = b === btn;
            b.classList.toggle('active', active);
            b.setAttribute('aria-pressed', String(active));
          });
        });
      });
    }


    /* ============================================================
       БЛОК 7. ТОЧКА ВХОДА
       ============================================================ */

    async function init() {
      state.visited = loadVisited();
      initSettings();
      state.data = await loadData();
      renderHome();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

  })();
  </script>
</body>
</html>
